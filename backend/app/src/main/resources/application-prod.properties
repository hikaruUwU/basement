logging.level.org.springframework.web.servlet.PageNotFound=ERROR

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.health.defaults.enabled=false
management.metrics.tags.application=base-backend
management.prometheus.metrics.export.enabled=true

mybatis-flex.datasource.master.url=${MYBATIS_FLEX_DATASOURCE_MASTER_URL}
mybatis-flex.datasource.master.username=${MYBATIS_FLEX_DATASOURCE_MASTER_USERNAME}
mybatis-flex.datasource.master.password=${MYBATIS_FLEX_DATASOURCE_MASTER_PASSWORD}

spring.sql.init.mode=always

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
