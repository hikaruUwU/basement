load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_vhost_traffic_status_module.so;

user nginx;
worker_processes auto;
worker_rlimit_nofile 655350;

error_log /var/log/nginx/errorx.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/accessx.log combined buffer=64k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 50M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    brotli on;
    brotli_static on;
    brotli_comp_level 6;

    brotli_types
    text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    gzip on;
    gzip_static on;
    gzip_proxied any;
    gzip_min_length 1k;
    gzip_comp_level 6;

    gzip_types
    text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    gzip_vary on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # =========================================================
    # Backend
    # =========================================================

    upstream backend {
        server base-backend:8080 max_fails=2 fail_timeout=20s;
        keepalive 256;
    }

    # =========================================================
    # HTTP
    # =========================================================

    server {
        listen 80 backlog=65535;
        listen [::]:80 backlog=65535;

        server_name localhost;

        return 301 https://$host$request_uri;
    }

    # =========================================================
    # HTTPS
    # =========================================================

    server {
        listen 443 ssl backlog=65535;
        listen [::]:443 ssl backlog=65535;

        server_name localhost;

        # -----------------------------------------------------
        # SSL Certificate
        # -----------------------------------------------------

        ssl_certificate     /etc/nginx/ssl/test.pem;
        ssl_certificate_key /etc/nginx/ssl/test.key;

        # -----------------------------------------------------
        # TLS
        # -----------------------------------------------------

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        ssl_ciphers HIGH:!aNULL:!MD5;

        ssl_prefer_server_ciphers on;


        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        root /usr/share/nginx/html;

        # =====================================================
        # Frontend, app/web
        # =====================================================

        location = / {
            return 307 /extl/;
        }

        include nginx-extl.conf;

        # =====================================================
        # Backend Api
        # =====================================================

        location /api/ {
            proxy_pass http://backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 600s;
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 8 64k;
        }

        location ~ ^/api/actuator {
            return 404;
        }

        # =====================================================
        # robots.txt
        # =====================================================

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        # =====================================================
        # sitemap.xml
        # =====================================================

        location = /sitemap.xml {
            log_not_found off;
            access_log off;
        }

        # =====================================================
        # Error & Universal
        # =====================================================

        error_page 500 502 503 504 @json_500;

        location @json_500 {
            default_type application/json;
            charset utf-8;

            return 500 '{"code": 500, "message": "Server is under maintenance", "data": null}';
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # =========================================================
    # VTS
    # =========================================================

    vhost_traffic_status_zone shared:vhost_traffic_status:10m;

    server {
        listen 7070;

        location = /metrics {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format prometheus;

            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}