services:

#--------------------------------------------------------------------------
  backend:
    image: backend:v0.0.1
    build:
      context: ./java
    container_name: base-backend
    volumes:
      - backend_logs:/app/logs
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 1024M
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: ${SYSTEM_TZ:-Asia/Shanghai}
      MYBATIS_FLEX_DATASOURCE_MASTER_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?${DB_PARAMS}
      MYBATIS_FLEX_DATASOURCE_MASTER_USERNAME: ${DB_USERNAME}
      MYBATIS_FLEX_DATASOURCE_MASTER_PASSWORD: ${DB_PASSWORD}
      AWS_S3_ENDPOINT_INTERNAL: ${AWS_S3_ENDPOINT_INTERNAL}
      AWS_S3_ENDPOINT_EXTERNAL: ${AWS_S3_ENDPOINT_EXTERNAL}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION}
    networks:
      - app-tier
  frontend:
    image: frontend:v0.0.1
    build:
      context: ./vue
    container_name: base-frontend
    restart: always
    volumes:
      - /ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_max_syn_backlog=65535
      - net.ipv4.tcp_tw_reuse=1
      - net.ipv4.tcp_fin_timeout=15
    ulimits:
      nofile:
        soft: 655350
        hard: 655350
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 64M
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    depends_on:
      - backend
    networks:
      - app-tier
#-------------------------------------------------------------------------
  goaccess:
    image: allinurl/goaccess:1.11
    container_name: base-monitor
    network_mode: none
    profiles:
      - tools
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - nginx_logs:/srv/logs
    entrypoint: [ "goaccess", "/srv/logs/accessx.log", "--log-format=COMBINED", "--no-global-config", "--output=/srv/logs/report.html" ]
#-------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: base-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--port=9999'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 150M
    expose:
      - "9999"
    networks:
      - app-tier
#-------------------------------------------------------------------------
  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: base-victoria-metrics
    user: "0:0"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 150M
    expose:
      - 8428
    ports:
      - "8428:8428"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vm_data:/victoria-metrics-data
    command:
      - '-promscrape.config=/etc/prometheus/prometheus.yml'
      - '-storageDataPath=/victoria-metrics-data'
      - '-retentionPeriod=15d'
    depends_on:
      - backend
    networks:
      - app-tier
#-------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.1.1-distroless-slim
    container_name: base-grafana
    restart: unless-stopped
    profiles:
      - tools
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: ${SYSTEM_TZ:-Asia/Shanghai}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-tier
#-------------------------------------------------------------------------
volumes:
  backend_logs:
  nginx_logs:
  vm_data:
  grafana_data:

networks:
  app-tier:
    driver: bridge