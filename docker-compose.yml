services:
  backend:
    build:
      context: ./java
    container_name: base-backend
    volumes:
      - ./logs/jvm:/app/logs
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${SYSTEM_TZ}
      MYBATIS_FLEX_DATASOURCE_MASTER_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?${DB_PARAMS}
      MYBATIS_FLEX_DATASOURCE_MASTER_USERNAME: ${DB_USERNAME}
      MYBATIS_FLEX_DATASOURCE_MASTER_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-tier
  frontend:
    build:
      context: ./vue
    container_name: base-frontend
    restart: always
    volumes:
      - ./logs/nginx:/var/log/nginx
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 64M
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - backend
    networks:
      - app-tier

  goaccess:
    image: allinurl/goaccess:latest
    container_name: base-monitor
    network_mode: none
    profiles:
      - tools
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./logs/nginx:/srv/logs
    entrypoint: [ "goaccess", "/srv/logs/access.log", "--log-format=COMBINED", "--no-global-config", "--output=/srv/logs/report.html" ]

networks:
  app-tier:
    driver: bridge