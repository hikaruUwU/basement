global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - prometheus:9090


  - job_name: "spring"
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          - backend:8080
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance

  - job_name: "docker-containers"
    static_configs:
        - targets:
          - cadvisor:9999
