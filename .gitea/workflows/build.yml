name: build-java

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: maven:3.9.9-eclipse-temurin-21

    steps:

      - name: debug workspace
        run: |
          pwd
          ls -lah

      - name: build
        run: |
          mvn clean package -DskipTests

      - name: prepare artifact
        run: |
          mkdir -p artifact
          JAR=$(find target -name "*.jar" | head -n 1)
          cp "$JAR" artifact/app.jar

      - name: upload package
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)

          curl -X PUT \
            --user UwU:${GITEA_TOKEN} \
            --upload-file artifact/app.jar \
            http://47.121.125.149:3000/api/packages/mizuki/generic/basement/${VERSION}/app.jar